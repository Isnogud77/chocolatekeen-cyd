; Chocolate Keen port for ESP32-2432S028R (CYD2USB)
[platformio]
src_dir = .
default_envs = host

[common]
build_flags =
  -Iupstream -Iupstream/core -Iport -Iport/sdl_shim -Iassets
  -DCHOCOLATE_KEEN_IS_EPISODE1_ENABLED=1
  -DESP32_PORT=1

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@^2.5.43
build_src_filter = -<*> +<upstream/> +<port/> +<assets/> -<port/host/>
build_flags =
  ${common.build_flags}
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_INVERSION_OFF=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_MOSI=13
  -DTFT_MISO=12
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSPI_FREQUENCY=40000000
  -DUSE_HSPI_PORT=1

[env:cyd_portrait]
extends = env:cyd
build_flags =
  ${env:cyd.build_flags}
  -DKEEN_PORTRAIT=1

[env:host]
platform = native
build_src_filter = -<*> +<upstream/> +<port/> +<assets/> -<port/esp32/>
build_flags =
  ${common.build_flags}
  !sdl2-config --cflags --libs
  !echo "-I$(sdl2-config --prefix)/include"

[env:host_portrait]
extends = env:host
build_flags =
  ${env:host.build_flags}
  -DKEEN_PORTRAIT=1

; Unit tests: whole game minus backends; tests bring their own fakes (test_support/ = weak defaults).
[env:test]
platform = native
test_build_src = yes
build_src_filter = -<*> +<upstream/> +<port/> +<assets/> +<test_support/> -<port/host/> -<port/esp32/>
build_flags =
  ${common.build_flags}
